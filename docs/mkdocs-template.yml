site_name: DXNN All Suite (DX-AllSuite) User Manual
use_directory_urls: false
docs_dir: source # markdown 원문 폴더
site_dir: docs # html로 변환된 폴더
theme: 
  name : material
  language: en
  font:
    text: Noto Sans Display
    #text: Noto Serif
    #code: Noto Sans 
    code: Roboto Mono 
  logo: img/deepx.png
  #favicon: img/favicon.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
     - toc.integrate
     - content.code.annotate
     - navigation.tabs
     - navigation.tabs.sticky
     - content.tabs.link
     - content.code.copy
site_url: 'https://developer.deepx.ai/'
nav:
  - Home: index.md
  - Agent-Driven Development (Beta): 00_Agent_Driven_Development.md
  - Agent-Driven Development Showcases: 00b_Agent_Driven_Development_Showcases.md
  - DX-AllSuite Architecture Overview: 01_DX-AllSuite_Architecture_Overview.md
  - Setting Up Environment: 02_Setting_Up_Environment.md
  - Running Your First NPU Model: 03_Running_Your_First_NPU_Model.md
  - Version Compatibility: 04_Version_Compatibility.md
  - FAQ Troubleshooting Guide: 05_FAQ_Troubleshooting_Guide.md
  - DX AI Studio:
      # Copied from dx-ai-studio/docs/source at build time by mkdocs.sh (into
      # source/ai-studio/, then removed after build). Studio docs stay the single
      # source of truth in the dx-ai-studio tree — this only surfaces them here.
      - Installation & Launch: ai-studio/01_Installation_and_Launch.md
      - The Hub: ai-studio/02_The_Hub.md
      - DX Model Zoo: ai-studio/03_DX_Model_Zoo.md
      - DX Compiler: ai-studio/04_DX_Compiler.md
      - DX App: ai-studio/05_DX_App.md
      - DX Stream: ai-studio/06_DX_Stream.md
      - DX Monitor: ai-studio/07_DX_Monitor.md
      - DX Benchmark: ai-studio/08_DX_Benchmark.md
      - DX EdgeGuide: ai-studio/09_DX_EdgeGuide.md
      - DX Agent Dev: ai-studio/10_DX_Agent_Dev.md
      - SDK Library & About: ai-studio/11_SDK_Library_and_About.md
      - Third-Party License: ai-studio/12_Appendix_Third_Party_License.md
      - Change Log: ai-studio/Appendix_Change_Log.md

plugins:
  - search
  - include-markdown
  - to-pdf:
      author: DEEPX.ai
      copyright: ⓒ Copyright 2026 DEEPX All Rights Reserved.
      cover_title: DXNN All Suite (DX-AllSuite) User Manual
      cover_subtitle: 2026/08/14 (v2.4.2)
      cover_logo : img/deepx.png
      custom_template_path: source/stylesheets
      output_path: ../DEEPX_DX-AllSuite_UM_v2.4.2_AUG_2026.pdf

extra:
  homepage: https://developer.deepx.ai
  generator: false
  social:
     - icon: fontawesome/brands/linkedin
       link: https://www.linkedin.com/company/deepx-corporation/
extra_css: 
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - def_list
  - toc:
        permalink: "true"
        baselevel: 1
        separator: ">_"
        toc_depth: 3
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - attr_list
  - md_in_html
copyright: ⓒ Copyright 2026 <a href="http://deepx.ai">DEEPX</a>. All Rights Reserved.
