name: ghcr-release
run-name: Release DEEPX images to GHCR (${{ inputs.source_ref || github.ref_name }})

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      components:
        description: 'Comma-separated components to release. Blank = every component whose version is not in GHCR yet. Naming one explicitly makes an already-published version an error instead of a skip.'
        required: false
        default: ''
        type: string
      update_moving_tags:
        description: 'Also move the floating tags (latest, rt, rt-app, rt-stream, rt-app-stream)'
        required: false
        default: true
        type: boolean
      allow_overwrite:
        description: 'Republish a version that is already in GHCR (needed to re-run after a partial failure)'
        required: false
        default: false
        type: boolean
      source_ref:
        description: 'dx-all-suite branch, tag or SHA to build from (blank = the ref this run was dispatched on)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

# Two releases pushing the same floating tags would race on `latest`.
concurrency:
  group: ghcr-release
  cancel-in-progress: false

# Single place to change the build environment. `runs-on:` cannot read `env`, so the
# build matrix (including these labels) is generated by the `prepare` job below.
env:
  RUNNER_AMD64: ubuntu-24.04
  RUNNER_ARM64: ubuntu-24.04-arm
  UBUNTU_VERSION: '24.04'
  RUNTIME_VARIANTS: 'rt rt-app rt-stream rt-app-stream'

jobs:
  # Resolve versions and the job matrix exactly once, so the build and merge jobs
  # never re-derive a tag and drift apart.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      runtime_version: ${{ steps.meta.outputs.runtime_version }}
      compiler_version: ${{ steps.meta.outputs.compiler_version }}
      modelzoo_version: ${{ steps.meta.outputs.modelzoo_version }}
      # Set by the overwrite gate, not by `meta`: components whose version is already in
      # GHCR are dropped here, so the matrix below only builds what will actually publish.
      components: ${{ steps.gate.outputs.components }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      # The resolved commit, not the ref name. A branch can move between this job and the
      # arm64 build picking up a runner, which would build a different tree than the one
      # these versions were read from -- and could even split amd64 and arm64.
      source_sha: ${{ steps.src.outputs.sha }}
    steps:
      # Guarding here is enough for the whole workflow: `build` needs `prepare`, so a
      # missing secret stops everything with this message instead of an opaque
      # "fatal: could not read Username" from a submodule clone 20 minutes in.
      - name: Require submodule token
        env:
          GC_DCI_TOKEN: ${{ secrets.GC_DCI_TOKEN }}
        run: |
          [ -n "$GC_DCI_TOKEN" ] || {
            echo "::error::secret GC_DCI_TOKEN is not configured. It is required to clone the private dx-runtime / dx-compiler / dx-modelzoo submodules."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Version files live inside the submodules. `.gitmodules` uses relative URLs
          # (../dx-runtime.git), which actions/checkout resolves against this repo's
          # origin, i.e. the same org. github.token reaches only this repository, so
          # the PAT is required while the siblings are private.
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: true
          token: ${{ secrets.GC_DCI_TOKEN }}
          # Otherwise the PAT stays in .git/config for everything that runs afterwards.
          # source_ref can point at an unreviewed branch, so the checked-out build
          # scripts must not be handed this token.
          persist-credentials: false

      - name: Resolve source commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve versions
        id: meta
        env:
          COMPONENTS_INPUT: ${{ inputs.components }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # -f disables glob expansion for this whole step: components is user input and
          # `for c in $(echo "$components" ...)` would otherwise expand a '*' against the
          # repo root. Nothing here needs globbing.
          set -euo pipefail -f

          # GHCR paths must be lowercase; the org is spelled DEEPX-AI.
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

          # release.ver already carries a 'v'; pyproject.toml does not. Strip then
          # re-add so neither source can produce 'vv2.4.1'.
          norm() { printf 'v%s\n' "${1#v}"; }
          runtime_version=$(norm "$(tr -d '[:space:]' < dx-runtime/release.ver)")
          compiler_version=$(norm "$(tr -d '[:space:]' < dx-compiler/release.ver)")
          # `grep -m1` not `sed -n …p | head -1`: under pipefail a second match makes
          # head close the pipe and the producer dies of SIGPIPE (the hazard
          # docker/smoke_test.sh:76 documents). grep stops itself, so nothing is killed.
          modelzoo_version=$(norm "$(grep -m1 '^version *= *' dx-modelzoo/pyproject.toml | cut -d'"' -f2)")

          # `x=$(norm "$(cmd)")` takes its exit status from norm, not from the inner
          # substitution, and norm succeeds on empty input -- so a missing file or a
          # changed pyproject format yields a bare "v" and set -e never fires. Validate
          # outside the assignment; `exit` inside norm would only kill the subshell.
          for v in "$runtime_version" "$compiler_version" "$modelzoo_version"; do
            case "$v" in
              v[0-9]*) ;;
              *) echo "::error::unparseable version: '$v'. Check dx-*/release.ver and dx-modelzoo/pyproject.toml."; exit 1 ;;
            esac
          done

          # On a tag push the tag names the release, so a tag that disagrees with the
          # source tree would ship the wrong version silently. dx-runtime is the
          # reference: the three components version independently (dx-modelzoo is on
          # v0.10.1), so no single tag can match all three -- the others are logged only.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] \
             && [ "$GITHUB_REF_NAME" != "$runtime_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match dx-runtime/release.ver ($runtime_version). Update release.ver or retag."
            exit 1
          fi

          # Tolerate "runtime, compiler": without this the space makes the ,x, match
          # fail and the component is dropped silently instead of erroring.
          # Blank input (tag push, or a dispatch left at the default) means "release
          # whatever still needs it" and lets the gate below skip published components.
          # A non-blank input is an explicit request, so the gate errors instead.
          explicit=true
          components=$(echo "${COMPONENTS_INPUT}" | tr -d '[:space:]')
          if [ -z "$components" ]; then
            explicit=false
            components="runtime,compiler,modelzoo"
          fi

          # Reject unknown names up front. Checking only "nothing matched" below would
          # let 'runtime,compilr' release half the suite and still report success.
          for c in $(echo "$components" | tr ',' ' '); do
            case "$c" in
              runtime|compiler|modelzoo) ;;
              *) echo "::error::unknown component '$c'. Expected runtime, compiler and/or modelzoo."; exit 1 ;;
            esac
          done

          {
            echo "registry=$registry"
            echo "candidates=$components"
            echo "explicit=$explicit"
            echo "runtime_version=$runtime_version"
            echo "compiler_version=$compiler_version"
            echo "modelzoo_version=$modelzoo_version"
          } >> "$GITHUB_OUTPUT"

      # Before the overwrite guard, so a blocked release still shows what it resolved.
      - name: Show resolved release plan
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          RUNTIME_VERSION: ${{ steps.meta.outputs.runtime_version }}
          COMPILER_VERSION: ${{ steps.meta.outputs.compiler_version }}
          MODELZOO_VERSION: ${{ steps.meta.outputs.modelzoo_version }}
          CANDIDATES: ${{ steps.meta.outputs.candidates }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
        run: |
          echo "source ref:  $SOURCE_REF"
          echo "source sha:  $SOURCE_SHA"
          echo "registry:    $REGISTRY"
          echo "dx-runtime:  $RUNTIME_VERSION"
          echo "dx-compiler: $COMPILER_VERSION"
          echo "dx-modelzoo: $MODELZOO_VERSION"
          echo "candidates:  $CANDIDATES (the gate may drop already-published ones)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR cannot mark a tag immutable, so this is the only place it can be enforced.
      # Re-running the same version is a full cold-cache rebuild, and if apt/pip moved
      # upstream in between, v2.4.1-rt silently changes content -- undebuggable later.
      #
      # This also decides WHAT gets built. The three components version independently, so
      # a tag push that only bumps dx-runtime still names all three: failing because
      # dx-compiler is unchanged would mean a release is only ever possible when all three
      # move together. An implicit selection therefore skips what is already published; an
      # explicit one errors, because the user asked for that component by name.
      - name: Gate on versions already in GHCR
        id: gate
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          CANDIDATES: ${{ steps.meta.outputs.candidates }}
          EXPLICIT: ${{ steps.meta.outputs.explicit }}
          RUNTIME_VERSION: ${{ steps.meta.outputs.runtime_version }}
          COMPILER_VERSION: ${{ steps.meta.outputs.compiler_version }}
          MODELZOO_VERSION: ${{ steps.meta.outputs.modelzoo_version }}
          # `inputs` is null on a tag push, so this evaluates to false there and the
          # gate stays armed -- a tag push is always a new release. Deliberately the
          # mirror of MOVING in merge-manifest: `&&` returns the first falsy operand.
          ALLOW_OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_overwrite }}
        run: |
          set -euo pipefail -f

          if [ "$ALLOW_OVERWRITE" = true ]; then
            echo "allow_overwrite=true -- republishing $CANDIDATES without checking GHCR"
            echo "components=$CANDIDATES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `imagetools inspect` exits 1 for BOTH "no such tag" and "403 Forbidden", and
          # only stderr tells them apart. `docker login` above proves registry-level auth
          # but not per-package read access -- a GHCR package that is not linked to this
          # repo 403s here -- so treating every failure as "not published" would disarm
          # the gate silently. Accept only a not-found. The patterns stay broad because a
          # first release has no package at all, which GHCR words differently from a
          # missing tag (UNVERIFIED: needs real GHCR auth to confirm the exact wording;
          # an unrecognised message fails loudly rather than passing, which is the safe
          # direction -- fix the pattern if a legitimate first release trips it).
          kept=""
          rc=0
          for c in $(echo "$CANDIDATES" | tr ',' ' '); do
            case "$c" in
              runtime)  v="$RUNTIME_VERSION" ;;
              compiler) v="$COMPILER_VERSION" ;;
              modelzoo) v="$MODELZOO_VERSION" ;;
            esac
            ref="$REGISTRY/dx-$c:$v"

            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              if [ "$EXPLICIT" = true ]; then
                echo "::error::$ref is already published. Bump the version, drop dx-$c from the components input, or re-run with allow_overwrite=true to republish."
                rc=1
              else
                echo "  $ref already published -- skipping dx-$c"
              fi
              continue
            fi

            case "$out" in
              *"not found"* | *"NAME_UNKNOWN"* | *"MANIFEST_UNKNOWN"* | *"does not exist"*)
                echo "  $ref: not published"
                kept="${kept:+$kept,}$c"
                ;;
              *)
                echo "::error::GHCR probe for $ref failed for a reason other than not-found: $out"
                rc=1
                ;;
            esac
          done
          [ "$rc" -eq 0 ] || exit 1

          if [ -z "$kept" ]; then
            echo "::notice::every candidate version is already published -- nothing to release."
          fi
          echo "releasing: ${kept:-<nothing>}"
          echo "components=$kept" >> "$GITHUB_OUTPUT"

      # After the gate, so the matrix only contains components that will actually publish.
      - name: Build job matrix
        id: matrix
        env:
          COMPONENTS: ${{ steps.gate.outputs.components }}
        run: |
          set -euo pipefail -f
          entries=""
          add() {
            entries="${entries:+$entries,}{\"arch\":\"$1\",\"runner\":\"$2\",\"component\":\"$3\"}"
          }
          for c in runtime compiler modelzoo; do
            case ",$COMPONENTS," in *",$c,"*) ;; *) continue ;; esac
            add amd64 "$RUNNER_AMD64" "$c"
            # dx-compiler and dx-modelzoo are published for amd64 only.
            # compiler cannot build on arm64 at all: docker_build.sh arch_check
            # "amd64 x86_64" prints SKIP and returns 0, so an arm64 job would go
            # green with no image and break the manifest merge. modelzoo has no
            # such guard and would build, but arm64 is not a supported platform
            # for it -- excluded here so no arm64 tag is ever pushed.
            case "$c" in
              compiler|modelzoo) ;;
              *) add arm64 "$RUNNER_ARM64" "$c" ;;
            esac
          done
          # An empty matrix is valid here: the build and merge jobs are gated on
          # components being non-empty, so neither runs and nothing evaluates it.
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # Empty when the gate dropped every candidate as already published.
    if: needs.prepare.outputs.components != ''
    runs-on: ${{ matrix.runner }}
    # dx_stream builds OpenCV 4.2.0 + contrib from source at -j2 (install script uses
    # nproc/2 on a 4-vCPU runner), and that stage runs twice per arch: rt-stream is
    # FROM rt while rt-app-stream is FROM rt-app, so the two branches cannot share it.
    #
    # Measured, not estimated: on Ubuntu 24.04 dx_stream does NOT build OpenCV from
    # source -- setup_opencv finds apt libopencv-dev 4.6.0, which satisfies its 4.2.0
    # floor -- so all four variants took ~505s on a 20-core host. Even at 5x for a
    # 4-vCPU runner that is well under an hour. The ceiling stays high because the
    # GitHub job limit is 6h and headroom costs nothing, not because a 5h build is
    # expected; do not cite this number as a reason to add build caching.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit prepare resolved, not a branch name: a branch can move while this
          # job waits for a runner, which would build a different tree than the one the
          # versions came from, and could split amd64 from arm64.
          ref: ${{ needs.prepare.outputs.source_sha }}
          submodules: recursive
          token: ${{ secrets.GC_DCI_TOKEN }}
          # Keeps the PAT out of .git/config, which the build scripts below can read.
          persist-credentials: false

      # Peak usage is ~11-12GB of the 14GB image store. Dropping preinstalled toolchains
      # we never use buys ~20GB. Items absent on arm64 are a no-op for rm -rf.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Preflight
        run: |
          set -euo pipefail
          # docker_build.sh offers to install the compose plugin interactively when it
          # is missing. Fail loudly here instead of letting that path run in CI.
          docker compose version
          docker buildx version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test and push
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          RUNTIME_VERSION: ${{ needs.prepare.outputs.runtime_version }}
          COMPILER_VERSION: ${{ needs.prepare.outputs.compiler_version }}
          MODELZOO_VERSION: ${{ needs.prepare.outputs.modelzoo_version }}
        run: |
          set -euo pipefail

          case "$COMPONENT" in
            runtime)  VERSION="$RUNTIME_VERSION" ;;
            compiler) VERSION="$COMPILER_VERSION" ;;
            modelzoo) VERSION="$MODELZOO_VERSION" ;;
            *) echo "unknown component: $COMPONENT" >&2; exit 1 ;;
          esac

          # The only place a (component, variant) pair is turned into image refs.
          # smoke_test.sh never pulls, so LOCAL_IMAGE must match what docker_build.sh
          # just tagged -- computing the suffix twice is how that silently breaks.
          refs() {
            local variant="$1" suffix=""
            # docker_build.sh appends '-<variant>' only for non-default variants.
            # `case`, not an && chain: as the chain is not the last statement here it is
            # safe today, but under set -e it becomes a silent early return the moment
            # either following line moves.
            case "$variant" in
              "" | rt-app-stream) ;;
              *) suffix="-$variant" ;;
            esac
            LOCAL_IMAGE="dx-${COMPONENT}:ubuntu-${UBUNTU_VERSION}${suffix}"
            REMOTE_IMAGE="${REGISTRY}/dx-${COMPONENT}:${VERSION}${variant:+-$variant}-${ARCH}"
          }

          publish() {
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
            docker push "$REMOTE_IMAGE"
          }

          if [ "$COMPONENT" = runtime ]; then
            archive_flag=""
            for variant in $RUNTIME_VARIANTS; do
              refs "$variant"
              ./docker_build.sh --target=dx-runtime \
                  --ubuntu_version="$UBUNTU_VERSION" --variant="$variant" ${archive_flag}
              # `git archive` is byte-deterministic for a fixed commit, so the tarballs
              # the first pass produced are exactly what the other three variants need.
              archive_flag="--skip-archive"
              docker/smoke_test.sh "$LOCAL_IMAGE" runtime "$variant"
              publish
              # Peak store usage is close to the runner's 14GB. If a later variant ever
              # dies on ENOSPC, this is the record of how much margin was left.
              # `|| true`: pure instrumentation, and it is the last statement in the loop
              # body -- a failing df would otherwise fail the step after a successful push.
              { df -h /; docker system df; } || true
            done
          else
            refs ""
            ./docker_build.sh --target="dx-${COMPONENT}" --ubuntu_version="$UBUNTU_VERSION"
            docker/smoke_test.sh "$LOCAL_IMAGE" "$COMPONENT"
            publish
          fi

  merge-manifest:
    needs: [prepare, build]
    if: needs.prepare.outputs.components != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch manifests
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          COMPONENTS: ${{ needs.prepare.outputs.components }}
          RUNTIME_VERSION: ${{ needs.prepare.outputs.runtime_version }}
          COMPILER_VERSION: ${{ needs.prepare.outputs.compiler_version }}
          MODELZOO_VERSION: ${{ needs.prepare.outputs.modelzoo_version }}
          # `inputs` only exists for workflow_dispatch, and `default:` is NOT applied on
          # other triggers -- on `push: tags` it is null, and null != false casts to
          # 0 != 0, i.e. false. So gate on the event first: any non-dispatch trigger is
          # a real release and moves the tags. Do not compare against the string
          # 'false' either: for a dispatch boolean that casts to NaN != 0, always true.
          MOVING: ${{ github.event_name != 'workflow_dispatch' || inputs.update_moving_tags }}
        run: |
          set -euo pipefail

          enabled() { case ",$COMPONENTS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }

          # merge <repo> "<source tags>" "<target tags>"
          merge() {
            local repo="$1" sources="$2" targets="$3" args=() t s
            for t in $targets; do args+=(-t "$repo:$t"); done
            for s in $sources; do args+=("$repo:$s"); done
            echo "+ docker buildx imagetools create ${args[*]}"
            docker buildx imagetools create "${args[@]}"
          }

          if enabled runtime; then
            for variant in $RUNTIME_VARIANTS; do
              targets="${RUNTIME_VERSION}-${variant}"
              if [ "$MOVING" = true ]; then targets="$targets $variant"; fi
              # rt-app-stream is the default image, so it also owns the bare tags.
              if [ "$variant" = rt-app-stream ]; then
                targets="$targets $RUNTIME_VERSION"
                if [ "$MOVING" = true ]; then targets="$targets latest"; fi
              fi
              merge "$REGISTRY/dx-runtime" \
                    "${RUNTIME_VERSION}-${variant}-amd64 ${RUNTIME_VERSION}-${variant}-arm64" \
                    "$targets"
            done
          fi

          if enabled compiler; then
            targets="$COMPILER_VERSION"
            if [ "$MOVING" = true ]; then targets="$targets latest"; fi
            # amd64 only -- single-arch manifest by design.
            merge "$REGISTRY/dx-compiler" "${COMPILER_VERSION}-amd64" "$targets"
          fi

          if enabled modelzoo; then
            targets="$MODELZOO_VERSION"
            if [ "$MOVING" = true ]; then targets="$targets latest"; fi
            # amd64 only -- single-arch manifest by design.
            merge "$REGISTRY/dx-modelzoo" "${MODELZOO_VERSION}-amd64" "$targets"
          fi
