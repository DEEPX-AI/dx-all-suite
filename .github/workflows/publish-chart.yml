name: publish-chart

on:
  push:
    branches: [main]
    paths: ["deploy/k8s/charts/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to package the chart from (empty = the branch selected above)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push runs leave inputs.ref empty, so they package the pushed commit.
          ref: ${{ inputs.ref || github.ref }}

      - uses: azure/setup-helm@v4

      - name: Lint & package
        run: |
          helm repo add node-feature-discovery https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm dependency build deploy/k8s/charts/dx-npu
          helm lint deploy/k8s/charts/dx-npu
          helm package deploy/k8s/charts/dx-npu -d /tmp/chart

      - name: Push to ghcr (OCI)
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push /tmp/chart/dx-npu-*.tgz "oci://ghcr.io/${OWNER}/charts"
