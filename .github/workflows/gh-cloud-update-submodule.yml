name: Update Submodule

on:
  repository_dispatch:
    types:
      - update-submodule

permissions: write-all

jobs:
  update-submodule:
    uses: DEEPX-AI/do_workflows-central/.github/workflows/update-submodule-pointer.yml@main
    with:
      submodule: ${{ github.event.client_payload.name }}
      target_commit: ${{ github.event.client_payload.sha }}
      branch: ${{ github.event.client_payload.ref }}
    secrets:
      token: ${{ secrets.GC_DCI_TOKEN }}
