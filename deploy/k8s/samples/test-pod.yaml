# Smoke test: requests one DX-M1 NPU and prints device + dxcli status.
#
# Base image needs a glibc at least as new as the host DX-RT binaries injected by
# CDI require (check on the node: objdump -T /usr/local/bin/dxcli | grep GLIBC_).
# Prebuilt libdxrt-bin needs glibc >= 2.27; a DX-RT built from source on the node
# follows the node's glibc (e.g. GLIBC_2.38 on Ubuntu 24.04). ubuntu:24.04 is a
# safe default.
apiVersion: v1
kind: Pod
metadata:
  name: dx-m1-test
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "=== /dev/dxrt* ===";  ls -l /dev/dxrt* || echo "no NPU injected"
          echo "=== dxcli -s ==="; LD_LIBRARY_PATH=/usr/local/lib /usr/local/bin/dxcli -s || echo "dxcli unavailable"
          # Stay Running long enough for `kubectl wait --for=...Running` and
          # `kubectl logs` in the docs; exiting at once would skip straight to
          # Succeeded and the wait would time out.
          sleep 120
      resources:
        limits:
          deepx.ai/dx-m1: 1
