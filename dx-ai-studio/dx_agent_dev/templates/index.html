<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DX Agent Dev</title>
  <link rel="icon" type="image/svg+xml" href="/static/shared/favicons/dx_agent_dev.svg">
  <link rel="stylesheet" href="/static/shared/dx-fonts.css">
  <link rel="stylesheet" href="/static/shared/dx-tokens.css">
  <link rel="stylesheet" href="/static/shared/dx-semantic.css">
  <link rel="stylesheet" href="/static/shared/dx-theme-light.css">
  <link rel="stylesheet" href="/static/shared/dx-shell.css">
  <link rel="stylesheet" href="/static/shared/dx-base.css">
  <link rel="stylesheet" href="/static/shared/dx-utilities.css">
  <link rel="stylesheet" href="/static/shared/dx-components.css">
  <link rel="stylesheet" href="/static/shared/module-chrome.css">
  <link rel="stylesheet" href="/static/shared/brand.css">
  <link rel="stylesheet" href="/static/shared/tutorial.css">
  <link rel="stylesheet" href="/static/shared/toolbar.css">
  <link rel="stylesheet" href="/static/shared/chat-widget.css">
  <link rel="stylesheet" href="/static/css/console.css?m=dx_agent_dev">
<script src="/static/shared/dx-theme.js"></script>
<script src="/static/shared/dx-icon.js"></script>
</head>
<body>
<div class="dx-shell dx-shell--no-tabs">
{{DX_SHELL_RAIL}}
<div class="dx-shell-body">
{{DX_SHELL_HEADER}}
<main class="dx-shell-main agent-layout">

    <aside id="examples-left" class="examples-panel"></aside>
    <div id="agent-console">
      <div class="console-header">
        <div class="console-header-row">
          <span class="console-title" data-i18n="Agent Console">Agent Console
          </span>
          <span id="status-badge" class="status-badge"></span>
        </div>
        <div id="agent-controls" class="agent-toolbar" hidden>
          <div class="agent-toolbar-row">
            <div class="agent-picker" id="agent-picker">
              <span class="agent-picker-label" data-i18n="Agent">Agent
              </span>
              <div class="agent-picker-field">
                <select id="agent-select" class="agent-select console-select"></select>
                <span id="agent-auth-badge" class="agent-auth-badge" hidden aria-hidden="true"></span>
              </div>
            </div>
            <div class="agent-picker agent-picker--model">
              <span class="agent-picker-label" data-i18n="Model">Model
              </span>
              <select id="model-select" class="agent-select agent-select--model console-select"></select>
            </div>
            <div class="agent-picker" id="effort-control" hidden>
              <span class="agent-picker-label" data-i18n="Effort">Effort
              </span>
              <select id="effort-select" class="agent-select console-select"></select>
            </div>
            <div class="agent-picker" id="target-control">
              <span class="agent-picker-label" data-i18n="Target">Target
              </span>
              <select id="target-select" class="agent-select console-select">
                <option value="suite" selected>Suite (dx-all-suite)</option>
                <option value="dx-runtime">dx-runtime</option>
                <option value="dx_app">dx_app</option>
                <option value="dx_stream">dx_stream</option>
                <option value="dx-compiler">dx-compiler</option>
              </select>
            </div>
            <div class="agent-picker" id="mode-control">
              <span class="agent-picker-label" data-i18n="Interaction">Interaction
              </span>
              <select id="mode-select" class="agent-select console-select">
                <option value="interactive" selected data-i18n="Interactive">Interactive</option>
                <option value="autopilot" data-i18n="Autopilot (no questions)">Autopilot (no questions)</option>
              </select>
            </div>
          </div>
          <div class="agent-toolbar-meta">
            <div id="model-quality-hint" class="model-quality-hint" hidden></div>
            <div id="agent-login-hint" class="agent-login-hint" hidden></div>
          </div>
        </div>
        <p class="console-role-hint" data-i18n="Main chat for building NPU apps. The chat button (bottom-right) is for SDK Q&amp;A.">Main chat for building NPU apps. The chat button (bottom-right) is for SDK Q&amp;A.
        </p>
        <p class="console-session-hint" data-i18n-html="Agent knowledge comes from the dx-all-suite &lt;code&gt;.deepx&lt;/code&gt; harness; outputs go to &lt;code&gt;workspace/agent-sessions/&lt;/code&gt;.">Agent knowledge comes from the dx-all-suite <code>.deepx</code> harness; outputs go to <code>workspace/agent-sessions/</code>.
        </p>
      </div>

      <div id="console-status-bar" hidden></div>
      <div id="console-output"></div>
      <div id="showcase-gallery" hidden></div>

      <form id="console-form">
        <input id="console-input" autocomplete="off">
        <button type="submit" id="console-send" data-i18n="Send">Send
        </button>
        <button type="button" id="console-stop" hidden data-i18n="Stop">Stop
        </button>
      </form>
    </div>
    <aside id="examples-right" class="examples-panel"></aside>
  </main><!-- /dx-shell-main -->
</div><!-- /dx-shell-body -->
</div><!-- /dx-shell -->

  <script src="/static/js/i18n.js?m=dx_agent_dev"></script>
  <script src="/static/shared/i18n.js"></script>
  <script src="/static/shared/server-error-i18n.js"></script>
  <script src="/static/shared/brand.js"></script>
  <script>
DXBrand.mount({
  target: '#dxBrand',
  name: 'Agent Dev',
  subtitle: {
    ko: '자연어 NPU 앱 빌더',
    en: 'Natural-language NPU App Builder',
    es: 'Constructor de apps NPU en lenguaje natural',
    ja: '自然言語NPUアプリビルダー',
    'zh-CN': '自然语言NPU应用构建器',
    'zh-TW': '自然語言NPU應用建構器'
  },
  accent: 'var(--accent)'
});
  </script>
  <script src="/static/shared/toolbar.js"></script>
  <script>DXToolbar.init({ container: '.toolbar' });</script>
  <script src="/static/shared/vendor/mermaid.min.js" defer></script>
  <script src="/static/js/utils.js?m=dx_agent_dev"></script>
  <script src="/static/shared/markdown_render.js"></script>
  <script src="/static/js/console.js?m=dx_agent_dev"></script>
  <script src="/static/shared/tutorial-engine.js"></script>
  <script src="/static/shared/tutorial-init.js"></script>
  <script src="/static/js/tutorial.js?m=dx_agent_dev"></script>
  <script src="/static/shared/chat-widget.js"></script>
  <script>
DXChat.init({ appName: 'dx_agent_dev' });
  </script>
</body>
</html>
