<!-- DX HW Float Widget — auto-injected by launcher proxy -->
<style>
/* Fixed width + own box-sizing so the float renders identically in EVERY module
   iframe — a content-driven width would drift as values populate (--→numbers), the
   MOCK badge toggles, or a module's font fallback differs. A fixed width pins the
   outer box regardless of host CSS or content; slightly-long values just fit/wrap
   instead of widening it. */
/* Bottom left, starting collapsed — bottom right belongs to the chat button, and the expanded widget
   (≈210×340) would cover buttons, tables and Run. Expanded/collapsed state and the dragged position are remembered. */
.hw-float{box-sizing:border-box;position:fixed;bottom:20px;left:20px;z-index:9000;
  background:var(--surface-overlay);backdrop-filter:saturate(1.8) blur(20px);
  border:1px solid var(--border-subtle);border-radius:12px;
  padding:10px 14px;box-shadow:var(--shadow);
  width:212px;font-size:11px;transition:opacity .3s;
  user-select:none;font-family:Inter,-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;color:var(--text-primary)}
.hw-float *{box-sizing:border-box}
/* On module screens, start right of the left rail (56px) so the widget does not cover the rail's bottom buttons. */
body:has(.dx-shell-rail) .hw-float{left:calc(var(--dx-rail-w,56px) + var(--sp-3,12px))}
.hw-float.dragging{opacity:.85;transition:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.hw-float.minimized .hw-float-body{display:none}
.hw-float.minimized{width:max-content}
/* On screens with a module rail, the collapsed widget becomes a rail button above Hub — a bottom-left pill would
   cover page content even when scrolled to the end.
   The dot colour is the NPU temperature state (grey with no data). */
.hw-float.hw-docked.minimized{display:none}
.dx-shell-rail-foot:has(.hw-rail-btn){flex-direction:column;align-items:center;gap:4px}
.hw-rail-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--text-faint);box-shadow:0 0 0 2px var(--surface-panel)}
.hw-rail-btn[data-state="ok"] .hw-rail-dot{background:var(--status-ok)}
.hw-rail-btn[data-state="warn"] .hw-rail-dot{background:var(--status-warn)}
.hw-rail-btn[data-state="crit"] .hw-rail-dot{background:var(--status-error)}
.hw-rail-btn[aria-expanded="true"]{color:var(--accent);background:var(--accent-dim)}
.hw-float-header{display:flex;justify-content:space-between;align-items:center;
  cursor:grab;touch-action:none;padding:0;gap:8px}
.hw-float-header:active{cursor:grabbing}
.hw-float-title{font-size:11px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:.5px;flex:1}
.hw-float-toggle{font-size:14px;color:var(--text-muted);background:none;
  border:none;cursor:pointer;padding:2px 6px;border-radius:4px}
.hw-float-toggle:hover{color:#f5f5f7;background:rgba(255,255,255,.08)}
.hw-float-body{margin-top:8px}
.hw-float-row{display:flex;justify-content:space-between;align-items:center;
  padding:3px 0;border-bottom:1px solid rgba(42,52,65,.4);font-size:11px}
.hw-float-row:last-child{border-bottom:none}
.hf-k{color:var(--text-muted)}.hf-v{font-weight:600}
.hw-spark{margin-top:6px;cursor:pointer;border-top:1px solid rgba(42,52,65,.4);padding-top:6px}
.hw-spark canvas{display:block;width:100%;height:20px}
.hw-spark-label{font-size:9px;color:var(--text-muted);text-align:right;margin-top:2px}
.hw-float-status{font-size:9px;color:var(--status-warn);text-align:center;padding:4px 0}
.hw-npu-selector{display:flex;gap:4px;margin:8px 0 6px}
.hw-npu-selector[hidden]{display:none}
.hw-npu-selector button{flex:1;padding:3px 6px;border-radius:6px;border:1px solid rgba(41,151,255,.18);background:rgba(15,23,42,.6);color:var(--text-muted);font-size:10px;cursor:pointer}
.hw-npu-selector button.active{background:rgba(41,151,255,.18);color:#f5f5f7;border-color:rgba(41,151,255,.45)}
.hw-float-section{border-top:1px solid rgba(42,52,65,.4);padding-top:6px;margin-top:6px}
#hf-npu-section{border-top:none;padding-top:0;margin-top:0}
.hw-section-title{font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.45px;margin-bottom:3px}
.hf-v.warn{color:var(--status-warn)}.hf-v.crit{color:var(--status-error)}.hf-v.ok{color:var(--status-ok)}
.hf-mock-badge{display:inline-block;margin-left:5px;padding:0 4px;border-radius:3px;background:var(--status-warn);color:#1a1a1a;font-size:8px;font-weight:700;letter-spacing:.4px;vertical-align:middle}
</style>
<div class="hw-float minimized" id="hw-float">
  <div class="hw-float-header" id="hw-float-drag">
    <span class="hw-float-title"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#menu"></use></svg> <span data-i18n="NPU Monitor">NPU Monitor</span></span>
    <button class="hw-float-toggle" aria-label="Minimize" data-i18n-aria-label="Minimize" onclick="_hwFloatToggle()"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#chevd"></use></svg></button>
  </div>
  <div class="hw-float-body">
    <div id="hf-npu-selector" class="hw-npu-selector" hidden></div>
    <div id="hf-npu-section" class="hw-float-section">
      <div class="hw-section-title" id="hf-npu-title">NPU</div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#thermometer"></use></svg> <span data-i18n="Avg Temp">Avg Temp</span></span><span class="hf-v" id="hf-temp">--°C</span></div>
      <div id="hf-ctemps"></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#bench"></use></svg> <span data-i18n="NPU Util">NPU Util</span></span><span class="hf-v" id="hf-util">--%</span></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#memory"></use></svg> NPU DRAM</span><span class="hf-v" id="hf-dram">--%</span></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#clock"></use></svg> <span data-i18n="Clock">Clock</span></span><span class="hf-v" id="hf-clock">-- MHz</span></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#bolt"></use></svg> <span data-i18n="Voltage">Voltage</span></span><span class="hf-v" id="hf-volt">-- mV</span></div>
    </div>
    <div id="hf-system-section" class="hw-float-section">
      <div class="hw-section-title"><span data-i18n="System">System</span></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#cpu"></use></svg> <span data-i18n="CPU Load">CPU Load</span></span><span class="hf-v" id="hf-cpu">--</span></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#memory"></use></svg> <span data-i18n="Memory">Memory</span></span><span class="hf-v" id="hf-mem">--%</span></div>
      <div class="hw-float-row"><span class="hf-k"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#disk"></use></svg> <span data-i18n="Disk">Disk</span></span><span class="hf-v" id="hf-disk">--%</span></div>
    </div>
    <div class="hw-float-status" id="hf-status" style="display:none"><span data-i18n="Connecting...">Connecting...</span></div>
    <div class="hw-spark" id="hf-spark" onclick="_hwSparkNext()">
      <canvas id="hf-spark-canvas" height="20"></canvas>
      <div class="hw-spark-label" id="hf-spark-label" data-i18n="NPU Temp">NPU Temp</div>
    </div>
  </div>
</div>
<script>
(function(){
  /* ── Widget self-contained JS ── */
  var _hf = document.getElementById('hw-float');
  if (!_hf) return;
  /* Remember expanded/collapsed — collapsed at first. 'hw-float-open' = '1' means expanded. */
  var _OPEN_KEY = 'hw-float-open';
  try { if (localStorage.getItem(_OPEN_KEY) === '1') _hf.classList.remove('minimized'); } catch (e) {}
  window._hwFloatToggle = function () {
    var minimized = _hf.classList.toggle('minimized');
    try { localStorage.setItem(_OPEN_KEY, minimized ? '0' : '1'); } catch (e) {}
    _syncRailBtn();
  };

  /* ── Rail dock: with a module rail, the collapsed widget is a rail button ── */
  var _railFoot = document.querySelector ? document.querySelector('.dx-shell-rail-foot') : null;
  var _railBtn = null, _railTemp = '';
  var _railW = 0;
  if (_railFoot) {
    _hf.classList.add('hw-docked');
    _railBtn = document.createElement('button');
    _railBtn.type = 'button';
    _railBtn.className = 'dx-rail-btn hw-rail-btn';
    _railBtn.setAttribute('aria-controls', 'hw-float');
    _railBtn.dataset.state = 'offline';
    _railBtn.innerHTML = '<svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#thermometer"></use></svg>'
      + '<span class="hw-rail-dot" aria-hidden="true"></span>';
    _railBtn.addEventListener('click', function () { window._hwFloatToggle(); });
    _railFoot.insertBefore(_railBtn, _railFoot.firstChild);
    var _rail = _railFoot.parentElement;
    _railW = _rail ? Math.round(_rail.getBoundingClientRect().right) : 0;
  }
  function _syncRailBtn() {
    if (!_railBtn) return;
    _railBtn.setAttribute('aria-expanded', _hf.classList.contains('minimized') ? 'false' : 'true');
    var label = (window.T ? T('NPU Monitor') : 'NPU Monitor') + (_railTemp ? ' · ' + _railTemp : '');
    _railBtn.title = label;
    _railBtn.setAttribute('aria-label', label);
  }
  function _syncRailState(n) {
    if (!_railBtn) return;
    var t = n && _isNum(n.temp_avg) ? n.temp_avg : null;
    _railTemp = t === null ? '' : t.toFixed(1) + '°C';
    _railBtn.dataset.state = t === null ? 'offline' : (_statusFor('npu_temp', t) || 'ok');
    _syncRailBtn();
  }
  _syncRailBtn();
  var _drag = {active:false, ox:0, oy:0};
  var _sparkData = [], _sparkMode = 0;
  var _MODES = ['temp','volt','clock','ctemp','cpu','mem','dram','util'];
  var _LABELS = {temp:'NPU Temp',volt:'Voltage',clock:'Clock',ctemp:'Core Temp',
                 cpu:'CPU Load',mem:'Memory',dram:'NPU DRAM',util:'NPU Util'};
  var _MOCK_BADGE_TITLES = {
    en:'Simulated data — DX Engine unavailable in this module. Values are not from the NPU.',
    ko:'시뮬레이션 데이터 — 이 모듈에서 DX Engine을 사용할 수 없습니다. 값은 NPU에서 가져온 것이 아닙니다.',
    ja:'シミュレーションデータ — このモジュールでは DX Engine を利用できません。値は NPU から取得したものではありません。',
    es:'Datos simulados: DX Engine no está disponible en este módulo. Los valores no proceden de la NPU.',
    'zh-CN':'模拟数据：此模块中 DX Engine 不可用。数值并非来自 NPU。',
    'zh-TW':'模擬資料：此模組中 DX Engine 無法使用。數值並非來自 NPU。'
  };

  /* ── State variables and helpers ── */
  var _lastPayload = null;
  var _thresholds = {};
  var _NPU_IDX_KEY = 'hw-float-npu-idx';
  var _selectedNpuIdx = _readNpuIdx();
  var _selectorKey = '';

  function _isNum(v){return typeof v==='number'&&isFinite(v);}
  function _normalizeDramPct(v){return _isNum(v)&&v>=0?v:null;}
  function _fmt(v,dec,suffix){return _isNum(v)?v.toFixed(dec)+(suffix||''):'N/A';}
  function _fmtRound(v,suffix){return _isNum(v)?Math.round(v)+(suffix||''):'N/A';}
  function _avg(arr){return Array.isArray(arr)&&arr.length?arr.reduce(function(a,b){return a+b},0)/arr.length:null;}
  function _escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function _currentLang(){return (window.DXI18n&&window.DXI18n.lang)||document.documentElement.lang||'en';}
  function _mockBadgeTitle(){return _MOCK_BADGE_TITLES[_currentLang()]||_MOCK_BADGE_TITLES.en;}

  /* ── Selected-index persistence ── */
  function _readNpuIdx(){
    try{
      var raw=localStorage.getItem(_NPU_IDX_KEY);
      var idx=parseInt(raw,10);
      return isFinite(idx)&&idx>=0?idx:0;
    }catch(e){return 0;}
  }
  function _saveNpuIdx(idx){
    _selectedNpuIdx=idx;
    try{localStorage.setItem(_NPU_IDX_KEY,String(idx));}catch(e){}
  }
  function _selectedNpu(npus){
    if(!Array.isArray(npus)||!npus.length)return null;
    if(_selectedNpuIdx>=npus.length){_saveNpuIdx(0);}
    return npus[_selectedNpuIdx]||npus[0]||null;
  }

  /* ── Selector rendering ── */
  function _renderSelector(npus){
    var el=document.getElementById('hf-npu-selector');
    if(!el)return;
    if(!Array.isArray(npus)||npus.length<=1){el.hidden=true;el.innerHTML='';_selectorKey='';return;}
    var key=npus.map(function(n,i){return (n&&n.id!=null)?n.id:i;}).join(',');
    el.hidden=false;
    if(key!==_selectorKey){
      _selectorKey=key;
      el.innerHTML=npus.map(function(n,i){
        var id=(n&&n.id!=null)?n.id:i;
        return '<button type="button" data-npu-idx="'+i+'" class="'+(i===_selectedNpuIdx?'active':'')+'">NPU '+_escHtml(id)+'</button>';
      }).join('');
      var buttons=el.querySelectorAll('button[data-npu-idx]');
      for(var i=0;i<buttons.length;i++){
        buttons[i].addEventListener('click',function(){
          _selectNpu(parseInt(this.dataset.npuIdx,10));
        });
      }
    }else{
      var buttons=el.querySelectorAll('button[data-npu-idx]');
      for(var i=0;i<buttons.length;i++){
        var cls=buttons[i].className||'';
        var isActive=parseInt(buttons[i].dataset.npuIdx,10)===_selectedNpuIdx;
        if(isActive&&cls.indexOf('active')===-1){buttons[i].className=cls?cls+' active':'active';}
        else if(!isActive&&cls.indexOf('active')!==-1){buttons[i].className=cls.replace(/\bactive\b/g,'').trim();}
      }
    }
  }
  function _selectNpu(idx){
    if(!isFinite(idx)||idx<0)return;
    _saveNpuIdx(idx);
    _sparkData=[];
    if(_lastPayload)_update(_lastPayload);
  }

  /* ── Status and value helpers ── */
  function _statusFor(key,value){
    var th=_thresholds[key];
    if(!_isNum(value)||!th)return'';
    if(_isNum(th.crit)&&value>=th.crit)return'crit';
    if(_isNum(th.warn)&&value>=th.warn)return'warn';
    return'ok';
  }
  function _setValue(id,text,status){
    var el=document.getElementById(id);
    if(!el)return;
    el.textContent=text;
    el.classList.remove('ok','warn','crit');
    if(status)el.classList.add(status);
  }

  /* ── Drag ── */
  var handle = document.getElementById('hw-float-drag');
  function dStart(cx, cy) {
    _drag.active = true;
    var r = _hf.getBoundingClientRect();
    _hf.style.right = 'auto'; _hf.style.bottom = 'auto';
    _hf.style.left = r.left + 'px'; _hf.style.top = r.top + 'px';
    _drag.ox = cx - r.left; _drag.oy = cy - r.top;
    _hf.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }
  function dMove(cx, cy) {
    if (!_drag.active) return;
    _hf.style.left = Math.max(_railW, Math.min(window.innerWidth - _hf.offsetWidth, cx - _drag.ox)) + 'px';
    _hf.style.top = Math.max(0, Math.min(window.innerHeight - _hf.offsetHeight, cy - _drag.oy)) + 'px';
  }
  function dEnd() {
    if (!_drag.active) return;
    _drag.active = false; _hf.classList.remove('dragging');
    document.body.style.userSelect = '';
    var r = _hf.getBoundingClientRect();
    try { localStorage.setItem('hw-float-pos', JSON.stringify({x:Math.round(r.left),y:Math.round(r.top)})); } catch(e){}
  }
  handle.addEventListener('mousedown', function(e) {
    if (e.target.classList.contains('hw-float-toggle') || e.button !== 0) return;
    e.preventDefault(); dStart(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', function(e) { dMove(e.clientX, e.clientY); });
  document.addEventListener('mouseup', dEnd);
  handle.addEventListener('touchstart', function(e) {
    if (e.target.classList.contains('hw-float-toggle')) return;
    e.preventDefault(); dStart(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  document.addEventListener('touchmove', function(e) {
    if (!_drag.active) return; e.preventDefault();
    dMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  document.addEventListener('touchend', dEnd);

  /* ── Restore position ── */
  try {
    var saved = localStorage.getItem('hw-float-pos');
    if (saved) {
      var pos = JSON.parse(saved);
      requestAnimationFrame(function() {
        _hf.style.right = 'auto'; _hf.style.bottom = 'auto';
        _hf.style.left = Math.max(_railW, Math.min(pos.x, window.innerWidth - 220)) + 'px';
        _hf.style.top = Math.max(0, Math.min(pos.y, window.innerHeight - 200)) + 'px';
      });
    }
  } catch(e){}

  /* ── Status indicator ── */
  var _statusEl = document.getElementById('hf-status');
  function _showStatus(show) {
    if (_statusEl) _statusEl.style.display = show ? '' : 'none';
  }

  /* ── Update data ── */
  function _update(d) {
    _showStatus(false);
    _lastPayload=d||{};
    var npus=Array.isArray(_lastPayload.npus)?_lastPayload.npus:[];
    var n=_selectedNpu(npus);
    _renderSelector(npus);
    _syncRailState(n);

    /* NPU title (+ MOCK badge when the source is serving simulated data — otherwise
       the sin-wave demo values look like real telemetry and get mistaken for a bug). */
    var titleEl=document.getElementById('hf-npu-title');
    if(titleEl){
      var _isMock=!!(_lastPayload&&_lastPayload.mock)||!!(n&&n.mock);
      var _title=n?('NPU '+((n.id!=null)?n.id:_selectedNpuIdx)):(window.T?T('No NPU'):'No NPU');
      titleEl.innerHTML=_escHtml(_title)+(_isMock?' <span class="hf-mock-badge" title="'+_escHtml(_mockBadgeTitle())+'">MOCK</span>':'');
    }

    /* NPU values */
    if(n){
      _setValue('hf-temp',_fmt(n.temp_avg,1,'°C'),_statusFor('npu_temp',n.temp_avg));
      _setValue('hf-util',_fmt(_avg(n.utilization),1,'%'),'');
      _setValue('hf-dram',_fmt(_normalizeDramPct(n.dram_pct),1,'%'),_statusFor('npu_dram',_normalizeDramPct(n.dram_pct)));
      _setValue('hf-clock',_fmtRound(n.clock_avg,' MHz'),'');
      _setValue('hf-volt',_fmtRound(n.voltage_avg,' mV'),'');
    }else{
      _setValue('hf-temp','N/A','');
      _setValue('hf-util','N/A','');
      _setValue('hf-dram','N/A','');
      _setValue('hf-clock','N/A','');
      _setValue('hf-volt','N/A','');
    }

    /* System values */
    _setValue('hf-cpu',_fmt(_lastPayload.cpu_load,2),'');
    _setValue('hf-mem',_fmt(_lastPayload.mem_pct,1,'%'),'');
    _setValue('hf-disk',_fmt(_lastPayload.disk_pct,1,'%'),'');

    /* Sparkline data push */
    var mode = _MODES[_sparkMode];
    var val = 0;
    if (n) {
      if (mode==='temp') val=n.temp_avg||0;
      else if (mode==='volt') val=n.voltage_avg||0;
      else if (mode==='clock') val=n.clock_avg||0;
      else if (mode==='ctemp') val=(n.temperatures&&n.temperatures[0])||0;
      else if (mode==='dram') val=_normalizeDramPct(n.dram_pct)||0;
      else if (mode==='util') val=Array.isArray(n.utilization)&&n.utilization.length?
        n.utilization.reduce(function(a,b){return a+b},0)/n.utilization.length:0;
    }
    if (mode==='cpu') val=_lastPayload.cpu_load||0;
    if (mode==='mem') val=_lastPayload.mem_pct||0;
    _sparkData.push(val);
    if (_sparkData.length > 40) _sparkData.shift();
    _drawSpark();
  }

  /* ── Sparkline Canvas ── */
  function _drawSpark() {
    var canvas = document.getElementById('hf-spark-canvas');
    if (!canvas || !_sparkData.length) return;
    var ctx = canvas.getContext('2d');
    var w = canvas.parentElement.offsetWidth || 180;
    canvas.width = w * 2; canvas.height = 40;
    canvas.style.width = w + 'px'; canvas.style.height = '20px';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var data = _sparkData;
    var max = Math.max.apply(null, data) * 1.1 || 1;
    var min = Math.min.apply(null, data) * 0.9;
    if (max === min) max = min + 1;
    var step = canvas.width / Math.max(data.length - 1, 1);
    ctx.beginPath();
    // Canvas cannot read CSS variables ('var(--accent)' would be ignored and draw black), so resolve it first.
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); ctx.lineWidth = 2;
    for (var i = 0; i < data.length; i++) {
      var x = i * step;
      var y = canvas.height - ((data[i] - min) / (max - min)) * (canvas.height - 4) - 2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  /* ── Spark mode toggle ── */
  window._hwSparkNext = function() {
    _sparkMode = (_sparkMode + 1) % _MODES.length;
    _sparkData = [];
    var lbl = document.getElementById('hf-spark-label');
    if (lbl) {
      lbl.setAttribute('data-i18n', _LABELS[_MODES[_sparkMode]]);
      lbl.textContent = window.T ? T(_LABELS[_MODES[_sparkMode]]) : _LABELS[_MODES[_sparkMode]];
    }
  };

  /* ── Threshold loading ── */
  function _loadThresholds(){
    fetch('/dx_monitor/api/system_info').then(function(r){return r.json();})
      .then(function(d){_thresholds=(d&&d.thresholds)||{};if(_lastPayload)_update(_lastPayload);})
      .catch(function(){});
  }

  /* ── HW data receiver ──────────────────────────────────────────────────
     This widget is injected into EVERY module page AND the launcher shell.
     It must NOT open its own EventSource: kept-alive module iframes would each
     hold a permanent /dx_monitor/api/hw_stream connection, and N of them
     exhaust the browser's ~6-connections-per-origin limit (everything is
     proxied through one origin), starving module navigation and health-checks.

     Instead the launcher shell owns ONE EventSource and fans payloads out via
     postMessage. Here we are a pure receiver. If no data arrives (shell stream
     still connecting, or this page opened standalone), show the offline hint. ── */
  var _waitTimer = setTimeout(function(){ _showStatus(true); }, 6000);
  window.addEventListener('message', function(ev) {
    var d = ev && ev.data;
    if (!d || d.type !== 'dx-hw-data' || !d.payload) return;
    if (_waitTimer) { clearTimeout(_waitTimer); _waitTimer = null; }
    try { _update(d.payload); } catch (e) {}
  });

  /* ── Test hook (gated) ── */
  if(window.__DX_HW_WIDGET_TEST_HOOK__){
    window.__DX_HW_WIDGET_TEST_HOOK__.update=_update;
    window.__DX_HW_WIDGET_TEST_HOOK__.selectNpu=_selectNpu;
    window.__DX_HW_WIDGET_TEST_HOOK__.getSelectedIdx=function(){return _selectedNpuIdx;};
  }

  _loadThresholds();
})();
</script>
