# SonarQube analysis for DX AI Studio.
#
# The server is NOT configured here on purpose. Pass the host and credentials at
# scan time so no endpoint or token is committed:
#
#   sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
#
# CI does exactly that from .github/workflows/dx-ai-studio-sonar.yml, which is a
# no-op until the SONAR_HOST_URL / SONAR_TOKEN secrets exist.

# --- identity ---------------------------------------------------------------
# Override with -Dsonar.projectKey=<org convention> if the DEEPX SonarQube already
# has a key for this project; nothing here depends on this exact value.
sonar.projectKey=deepx-dx-ai-studio
sonar.projectName=DX AI Studio
# projectVersion is intentionally NOT set here: release.ver is the single source
# of truth and a copy in this file would drift silently. CI passes it with
#   -Dsonar.projectVersion="$(cat release.ver)"

# --- what to analyse --------------------------------------------------------
# The ten shipped packages, matching pyproject's package list. `.` would also
# sweep in tools/, scripts/ and the generated dx-agent-dev/ sessions.
sonar.sources=shared,launcher,dx_app,dx_stream,dx_compiler,dx_modelzoo,dx_planner,dx_benchmark,dx_monitor,dx_agent_dev,dx_edge
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- python -----------------------------------------------------------------
# pyproject declares >=3.8 while requirements-ci.txt targets 3.12; declaring the
# range makes Sonar flag syntax that would break the oldest supported runtime.
sonar.python.version=3.8,3.12
# Cobertura, written by `bash scripts/run_ci.sh --coverage`.
#
# That stanza measures from a SINGLE root with relative_files=True, which is what
# makes this file usable: with the previous ten `source` roots every module's
# server.py rendered as filename="server.py" and the nine distinct files collapsed
# into one XML entry, so Sonar reported eight of them at 0%.
sonar.python.coverage.reportPaths=coverage.xml

# --- exclusions -------------------------------------------------------------
# Vendored and generated assets. Analysing these produces thousands of findings
# that nobody will ever act on and buries the real ones — the studio ships ~6 MB
# of JS, most of it not hand-maintained.
sonar.exclusions=\
  **/.venv/**,\
  **/var/**,\
  **/outputs/**,\
  **/dx-agent-dev/**,\
  **/__pycache__/**,\
  **/static/vendor/**,\
  **/*.min.js,\
  **/static/js/i18n.js,\
  **/static/fonts/**,\
  docs/**,\
  tests/visual/baselines/**

# Duplicated-code detection off for the translation/tutorial data tables: they are
# repetitive by nature (one near-identical block per locale) and would dominate
# the duplication metric.
sonar.cpd.exclusions=\
  **/static/js/i18n.js,\
  **/static/js/tutorial.js,\
  **/static/js/reference.js

# Test code is held to different rules than production code; Sonar needs to know
# which is which so it does not, for example, demand coverage OF the tests.
sonar.test.exclusions=tests/visual/baselines/**
