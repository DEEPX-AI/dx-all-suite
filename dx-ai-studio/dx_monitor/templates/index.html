<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DX Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/static/shared/favicons/dx_monitor.svg">
  <link rel="stylesheet" href="/static/shared/dx-fonts.css">
  <link rel="stylesheet" href="/static/shared/dx-tokens.css">
  <link rel="stylesheet" href="/static/shared/dx-semantic.css">
  <link rel="stylesheet" href="/static/shared/dx-theme-light.css">
  <link rel="stylesheet" href="/static/shared/dx-shell.css">
  <link rel="stylesheet" href="/static/shared/dx-base.css">
  <link rel="stylesheet" href="/static/shared/dx-utilities.css">
  <link rel="stylesheet" href="/static/shared/module-chrome.css">
  <link rel="stylesheet" href="/static/shared/dx-components.css">
  <link rel="stylesheet" href="/static/shared/brand.css">
  <link rel="stylesheet" href="/static/shared/tutorial.css">
  <link rel="stylesheet" href="/static/shared/toolbar.css">
  <link rel="stylesheet" href="/static/shared/chat-widget.css">
  <link rel="stylesheet" href="/static/css/style.css?m=dx_monitor">
<script src="/static/shared/dx-theme.js"></script>
<script src="/static/shared/dx-icon.js"></script>
</head>
<body>
<div class="dx-shell dx-shell--no-tabs">
{{DX_SHELL_RAIL}}
<div class="dx-shell-body">
{{DX_SHELL_HEADER}}
<main class="dx-shell-main monitor-main">

    <!-- SSE connection status -->
    <span id="sse-status" class="sse-status" style="display:none"></span>
    <span id="telemetry-status" class="sse-status telemetry-status" style="display:none"></span>
    <!-- Top summary card bar -->
    <div id="status-bar" class="status-bar"></div>

    <!-- Time range + chart selection controls -->
    <div class="card mt16">
      <div class="controls-row">
        <div class="btn-group" id="time-range-btns">
          <button id="tr-rt" class="active" onclick="setTimeRange('rt')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#clock"></use></svg> <span data-i18n="Realtime">Realtime</span></button>
          <button id="tr-5m" onclick="setTimeRange('5m')">5m</button>
          <button id="tr-15m" onclick="setTimeRange('15m')">15m</button>
          <button id="tr-30m" onclick="setTimeRange('30m')">30m</button>
          <button id="tr-1h" onclick="setTimeRange('1h')">1h</button>
          <button id="tr-all" onclick="setTimeRange('all')" data-i18n="All">All</button>
        </div>
        <div class="btn-group" id="chart-mode-btns">
          <button id="cm-temp" class="active" onclick="setChartMode('temp')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#thermometer"></use></svg> <span data-i18n="NPU Temp">NPU Temp</span></button>
          <button id="cm-volt" onclick="setChartMode('volt')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#bolt"></use></svg> <span data-i18n="Volt">Volt</span></button>
          <button id="cm-clock" onclick="setChartMode('clock')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#clock"></use></svg> <span data-i18n="Clock">Clock</span></button>
          <button id="cm-dram" onclick="setChartMode('dram')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#memory"></use></svg> NPU DRAM</button>
          <button id="cm-util" onclick="setChartMode('util')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#gear"></use></svg> <span data-i18n="NPU Util">NPU Util</span></button>
          <button id="cm-ctemp" onclick="setChartMode('ctemp')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#thermometer"></use></svg> <span data-i18n="Core Temp">Core Temp</span></button>
          <span class="btn-sep">|</span>
          <button id="cm-cpu" onclick="setChartMode('cpu')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#cpu"></use></svg> <span data-i18n="CPU Load">CPU Load</span></button>
          <button id="cm-mem" onclick="setChartMode('mem')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#memory"></use></svg> <span data-i18n="Memory">Memory</span></button>
          <button id="cm-cpucores" onclick="setChartMode('cpucores')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#cpu"></use></svg> <span data-i18n="CPU Cores">CPU Cores</span></button>
          <span class="btn-sep">|</span>
          <button id="cm-all" onclick="setChartMode('all')"><svg class="dx-ico" aria-hidden="true"><use href="/static/shared/dx-icons.svg#dashboard"></use></svg> <span data-i18n="View All">View All</span></button>
        </div>
      </div>
    </div>

    <!-- Chart area (JS builds one row per NPU) -->
    <div id="chart-area" class="mt16"></div>

    <!-- Bottom: NPU topology + system info + event log -->
    <div class="grid2 mt16">
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="NPU Topology">NPU Topology</h2>
          <span id="npu-status-label" class="badge b-cat">--</span>
        </div>
        <div id="npu-topo"></div>
        <!-- System info (merged under the topology) -->
        <div class="card-header mt16">
          <h2 data-i18n="System Info">System Info</h2>
        </div>
        <div class="tbl-wrap">
          <table id="sysinfo-table">
            <thead><tr>
              <th data-i18n="Property">Property</th>
              <th data-i18n="Value">Value</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="Runtime Events">Runtime Events</h2>
          <span id="event-count" class="badge b-cat">--</span>
        </div>
        <div id="event-log" class="event-log">
          <p class="txt-dim txt-sm" data-i18n="No events recorded">No events recorded</p>
        </div>
      </div>
    </div>
  </main><!-- /dx-shell-main -->
</div><!-- /dx-shell-body -->
</div><!-- /dx-shell -->

  <script src="/static/js/i18n.js?m=dx_monitor"></script>
  <script src="/static/shared/i18n.js"></script>
  <script src="/static/shared/server-error-i18n.js"></script>
  <script src="/static/shared/brand.js"></script>
  <script>
DXBrand.mount({
  target: '#dxBrand',
  name: 'Monitor',
  subtitle: {
    ko: 'NPU 하드웨어 모니터링',
    en: 'NPU Hardware Monitoring',
    es: 'Monitoreo de hardware NPU',
    ja: 'NPUハードウェアモニタリング',
    'zh-CN': 'NPU硬件监控',
    'zh-TW': 'NPU硬體監控'
  },
  accent: 'var(--accent)'
});
  </script>
  <script src="/static/shared/toolbar.js"></script>
  <script>DXToolbar.init({ container: '.toolbar' });</script>
  <script src="/static/js/utils.js?m=dx_monitor"></script>
  <script src="/static/shared/vendor/chart.umd.min.js"></script>
  <script src="/static/shared/dx-charts.js"></script>
  <script src="/static/js/charts.js?m=dx_monitor"></script>
  <script src="/static/js/dashboard.js?m=dx_monitor"></script>
  <script src="/static/shared/tutorial-engine.js"></script>
  <script src="/static/shared/tutorial-init.js"></script>
  <script src="/static/js/tutorial.js?m=dx_monitor"></script>
  <script src="/static/shared/chat-widget.js"></script>
  <script>DXChat.init({ appName: 'dx_monitor' });</script>
  <script>
    refreshDash();
    startSSE();
  </script>
</body>
</html>
