# NVIDIA GPU overlay — apply on top of docker-compose.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.nvidia_gpu.yml ...
# Image/container naming stays in docker-compose.yml; the calling script exports
# IMAGE_TAG_SUFFIX=cuda${CUDA_VERSION}-${BASE_IMAGE_NAME}-${OS_VERSION} so GPU images
# get a distinct tag. Requires nvidia-container-toolkit on the host.
# Scope: dx-compiler (q-pro) and dx-modelzoo (ONNX raw accuracy) only.
services:
  dx-compiler:
    runtime: nvidia
    build:
      args:
        BASE_IMAGE_NAME: "nvidia/cuda"
        TAG_NAME: "${CUDA_VERSION:-12.8.1}-cudnn-runtime-ubuntu${UBUNTU_VERSION}"
  dx-runtime:
    container_name: dx-runtime-${CUDA_VERSION:-12.8.1}-cudnn-runtime-ubuntu${UBUNTU_VERSION}
    image: dx-runtime:${CUDA_VERSION:-12.8.1}-cudnn-runtime-ubuntu${UBUNTU_VERSION}
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    build:
      args:
        FROM_IMAGE: "nvidia/cuda"
        TAG_NAME: "${CUDA_VERSION:-12.8.1}-cudnn-runtime-ubuntu${OS_VERSION}"
  dx-modelzoo:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    build:
      args:
        FROM_IMAGE: "nvidia/cuda"
        TAG_NAME: "${CUDA_VERSION:-12.8.1}-cudnn-runtime-ubuntu${OS_VERSION}"
