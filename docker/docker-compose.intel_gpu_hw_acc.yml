# Intel GPU HW acceleration (VA-API) overlay — apply on top of docker-compose.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.intel_gpu_hw_acc.yml ...
# Purpose: VA-API media decode/encode acceleration for dx-runtime (dx_stream pipelines).
# Naming via IMAGE_TAG_SUFFIX=vaapi-${BASE_IMAGE_NAME}-${OS_VERSION} (exported by scripts).
# Volumes/devices/privileged are inherited from docker-compose.yml (/dev is already mounted).
services:
  dx-runtime:
    build:
      args:
        INSTALL_VAAPI: "true"
