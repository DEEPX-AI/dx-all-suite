[pytest]
# Analyzer unit-test suite. All tests live under tests/ (the loose
# test_execution_rubric_v3.py was relocated here too). Run the whole suite with:
#   cd .deepx/tests/agentic_analyzer && pytest
# or from anywhere:
#   python -m pytest .deepx/tests/agentic_analyzer/tests/ -q
testpaths = tests
python_files = test_*.py
addopts = -q
